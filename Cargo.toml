[package]
name = "runarchive"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
bytes = "1.5"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
indicatif = "0.18.4"
zlib-rs = "0.4.1"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.12" }
tokio = { version = "1.37", features = ["sync", "macros", "io-util", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers", "Navigator", "StorageManager", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemWritableFileStream"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
tracing-subscriber = "0.3"
zip = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
