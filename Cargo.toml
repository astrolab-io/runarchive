[package]
name = "runarchive"
version = "0.1.0"
edition = "2021"
description = "Zero-copy ZIP parsing and range-read extraction over local files or HTTP, with async and blocking APIs, WASM-ready"
repository = "https://github.com/astrolab-io/runarchive"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["zip", "archive", "http", "range", "streaming"]
categories = ["compression", "parser-implementations", "wasm"]
include = ["/src/**", "/Cargo.toml", "/README.md"]

[features]
sync = ["flate2", "opendal/blocking", "tokio/rt"]
async-futures = ["async-compression/futures-io", "futures", "pin-project-lite", "tokio/rt"]
async-tokio = ["async-compression/tokio", "tokio", "tokio-util", "pin-project-lite", "futures"]

[dependencies]
bytes = "1.11"
clap = { version = "4.6", features = ["derive"] }
# `layers-retry` is one of opendal's defaults, but every read goes through it
# (see src/operator.rs) so it is named explicitly rather than inherited.
opendal = { version = "0.56", features = ["auto-register-services", "layers-retry", "services-fs", "services-http", "services-webdav"] }
tracing = "0.1"
url = "2.5"
tempfile = "3.10"
zip = "0.6"

flate2 = { version = "1.1", optional = true, default-features = false, features = ["zlib"] }
async-compression = { version = "0.4", optional = true, default-features = false, features = ["deflate"] }
futures = { version = "0.3", optional = true, default-features = false }
tokio = { version = "1", optional = true, default-features = false, features = ["io-util", "io-std", "rt"] }
tokio-util = { version = "0.7", optional = true, default-features = false, features = ["io-util"] }
pin-project-lite = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
dhat = "0.3"
tracing-subscriber = "0.3"
wasm-bindgen-test = "0.3.42"
wiremock = "0.6"
tempfile = "3.10"
zip = "0.6"
# The retry test needs a raw TCP origin (wiremock cannot truncate a body
# mid-flight), so it drives listeners and the multi-thread runtime directly.
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread", "io-util"] }
