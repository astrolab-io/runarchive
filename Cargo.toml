[package]
name = "runarchive"
version = "0.2.0"
edition = "2021"

[dependencies]
async-compression = { version = "0.4", features = ["deflate", "tokio"] }
bytes = "1.5"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
opendal = { git = "https://github.com/apache/opendal.git", features = ["auto-register-services", "services-fs", "services-http", "services-webdav"] }
tokio = { version = "1.49", features = ["io-std"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
dhat = "0.3"
tracing-subscriber = "0.3"
wasm-bindgen-test = "0.3.42"
wiremock = "0.6"
tempfile = "3.10"
zip = "0.6"
