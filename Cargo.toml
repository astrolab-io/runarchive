[package]
name = "runarchive"
version = "0.1.0"
edition = "2021"

[features]
# Enable the WASI Preview 2 / wasm32-wasip2 target (wstd async runtime + wasi:http).
# Resume is intentionally excluded on this target.
wasip2 = []

# Resume/checkpoint support for interrupted downloads (non-WASM targets only).
# Not compatible with wasip2.
resume = []

# Full CLI binary with progress bars.
cli = ["dep:clap", "dep:indicatif", "dep:tracing-subscriber", "resume"]

[dependencies]
bincode = "1.3.3"
bytes = "1.5"
hex = "0.4.3"
zlib-rs = "0.4.1"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
tracing = "0.1"

# CLI-only deps
clap = { version = "4.5", features = ["derive"], optional = true }
indicatif = { version = "0.18.4", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

# Native/desktop deps
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }

# WASM browser target deps
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.12" }
tokio = { version = "1.37", features = ["sync", "macros", "io-util", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers", "Navigator", "StorageManager", "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemWritableFileStream"] }

# WASI/wasmCloud deps
[target.'cfg(target_os = "wasi")'.dependencies]
wstd = { version = "0.6" }
wit-bindgen = { version = "0.46.0" }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
zip = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wiremock = "0.6"

[[bin]]
name = "runarchive"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
